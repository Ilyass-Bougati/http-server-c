name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Criterion is only needed here; without it the tests are skipped and the
      # rest of the build is unaffected.
      - name: Install Criterion
        run: sudo apt-get update && sudo apt-get install -y libcriterion-dev
      # Debug, so the tests run with the assertions and the -Wall -Wextra build
      # the developer sees rather than the optimised one that gets shipped.
      - run: cmake -B build -S .
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}